name: check

on:
  push:
  pull_request:

jobs:
  check-repo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: check-repo (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/check-repo.ps1
      - name: check-repo (PowerShell 7)
        shell: pwsh
        run: ./tests/check-repo.ps1

  e2e:
    # Creates plugins from the templates with the latest Paper and builds them (no test server: that needs the EULA).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: e2e
        shell: pwsh
        run: ./tests/e2e.ps1
