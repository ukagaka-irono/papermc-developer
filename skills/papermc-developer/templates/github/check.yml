name: check

# Branches: main (released), develop (next release), <topic>-fix (one change each).
on:
  push:
    branches:
      - main
      - develop
      - '*-fix'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '@@JAVA@@'
      - uses: gradle/actions/setup-gradle@v6
      - name: build and test
        run: ./gradlew build --console=plain
      - name: plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jar
          path: build/libs/*.jar
          if-no-files-found: error
