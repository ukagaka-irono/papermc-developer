name: release

# Push a tag such as v1.2.0 on main (after merging develop into main) to publish build/libs/*.jar
# as a GitHub release. The version in build.gradle.kts should match the tag
# (scripts/build-release.ps1 -Tag checks it locally).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Merge develop into main first, then tag main."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '@@JAVA@@'
      - uses: gradle/actions/setup-gradle@v6
      - name: build
        run: ./gradlew build --console=plain
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --title "$GITHUB_REF_NAME" --generate-notes
