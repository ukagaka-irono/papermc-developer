name: release

# Push a tag such as v1.2.0 to publish build/libs/*.jar as a GitHub release.
# The version in build.gradle.kts should match the tag (scripts/build-release.ps1 checks it locally).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '@@JAVA@@'
      - uses: gradle/actions/setup-gradle@v6
      - name: build
        run: ./gradlew build --console=plain
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --title "$GITHUB_REF_NAME" --generate-notes
